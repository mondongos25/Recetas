<!DOCTYPE html> <!-- Define el tipo de documento como HTML5 -->
<html lang="en"> <!-- Etiqueta raíz del documento HTML indicando el idioma -->
<head> <!-- Encabezado que contiene los metadatos y recursos externos -->
    <meta charset="UTF-8"> <!-- Establece la codificación de caracteres a UTF-8 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Compatibilidad de renderizado para navegadores Internet Explorer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Configura la escala responsiva para dispositivos móviles -->
    <title>Buscador Recetas Comida</title> <!-- Título que se muestra en la pestaña del navegador -->
    <link rel="stylesheet" href="css/bootstrap.min.css"> <!-- Vincula la hoja de estilos de Bootstrap para el diseño visual -->
</head>
<body> <!-- Cuerpo principal de la página web -->

    <!-- Barra de navegación superior responsiva utilizando Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success bg-gradient p-3">
        <div class="container-fluid"> <!-- Contenedor fluido que abarca todo el ancho de la pantalla -->
            <a class="navbar-brand fs-4" href="index.html">Buscador de Recetas De Uriel Escalona :V </a> <!-- Logotipo o título principal del navbar -->
            
            <!-- Botón desplegable para dispositivos móviles (hamburguesa) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menú de navegación colapsable -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link fs-4 active" aria-current="page" href="index.html">Inicio</a> <!-- Enlace activo a la página principal -->
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-4" href="favoritos.html">Mis Favoritos</a> <!-- Enlace hacia la vista de recetas favoritas -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal del contenido de la página -->
    <main class="mt-5 container-lg">
        <h2 class="text-center fs-1">Inicio</h2> <!-- Título centrado de la sección -->
  
        <!-- Contenedor flexible para centrar el formulario de búsqueda -->
        <div class="d-md-flex justify-content-md-center mt-5 ">
            <form class="card col-md-8 bg-light p-5"> <!-- Tarjeta que envuelve el formulario con relleno -->
                <div>
                    <label for="categorias" class="form-label">Categoría</label> <!-- Etiqueta descriptiva del selector -->
                    <select id="categorias" class="form-select"> <!-- Selector desplegable poblado dinámicamente desde la API -->
                        <option selected>-- Seleccione --</option> <!-- Opción por defecto no seleccionable -->
                    </select>
                </div>
            </form>
        </div>
        <!-- Contenedor donde JavaScript inyectará dinámicamente las tarjetas de recetas -->
        <div id="resultado" class="mt-5 row"></div>
    </main>

    <!-- Componente Modal de Bootstrap para mostrar los detalles de la receta -->
    <div class="modal fade" id="modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable"> <!-- Diálogo modal con desplazamiento interno habilitado -->
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-3 font-bold" id="staticBackdropLabel"></h1> <!-- Título dinámico de la receta en el modal -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button> <!-- Botón para cerrar el modal -->
                </div>
                <div class="modal-body"></div> <!-- Cuerpo dinámico donde se inyectan ingredientes e instrucciones -->
                <div class="modal-footer flex justify-content-between"></div> <!-- Pie de página del modal para botones de acción (Guardar/Cerrar) -->
            </div>
        </div>
    </div>

    <!-- Contenedor de notificaciones Toast (alertas flotantes) -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-danger text-white">
                <strong class="me-auto text-white">App Recetas</strong> <!-- Título de la notificación -->
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body"></div> <!-- Mensaje dinámico del toast -->
        </div>
    </div>

    <!-- Scripts de JavaScript externos -->
    <script src="js/bootstrap.bundle.min.js"></script> <!-- Script empaquetado de Bootstrap (incluye Popper) -->
    <script src="js/app.js"></script> <!-- Lógica principal de la aplicación web -->
</body>
</html>
